name: Auto-Generate PlantUML Diagrams

on:
  push:
    branches:
      - '**'
    branches-ignore:
      - main

permissions:
  contents: write

jobs:
  diagrams:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down the latest code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up JDK 17 for the backend
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Generate diagrams for backend (JDK 17)
    - name: Generate PlantUML Diagrams for Backend
      working-directory: MtdrSpring/backend
      run: mvn compile -Dskip.frontend=true -Dmaven.test.skip=true --no-transfer-progress

    # 4. Switch to JDK 21 for the telegram bot
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 5. Generate diagrams for telegram bot (JDK 21)
    - name: Generate PlantUML Diagrams for Telegram Bot
      working-directory: MtdrSpring/telegram-bot
      run: mvn compile -Dmaven.test.skip=true --no-transfer-progress

    # 6. Commit and push updated diagrams
    - name: Commit and Push updated diagrams
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: automated PlantUML diagram update [skip ci]"
        file_pattern: '**/docs/diagrams/*.puml'